name: Build Playmate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/playmate.jks"
            echo "PLAYMATE_KEYSTORE_PATH=$RUNNER_TEMP/playmate.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret found. Falling back to the debug key."
          fi

      - name: Build release APK
        env:
          PLAYMATE_KEYSTORE_PASSWORD: ${{ secrets.PLAYMATE_KEYSTORE_PASSWORD }}
          PLAYMATE_KEY_ALIAS: ${{ secrets.PLAYMATE_KEY_ALIAS }}
          PLAYMATE_KEY_PASSWORD: ${{ secrets.PLAYMATE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp build/outputs/apk/release/*.apk "out/Playmate-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Playmate-APK
          path: out/*.apk
          if-no-files-found: error
